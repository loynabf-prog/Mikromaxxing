<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#07080B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mikromaxxing">
  <title>Mikromaxxing</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <main id="app"></main>

  <div class="qfade" id="qfade"></div>
  <div class="qbar" id="qbar">
    <button class="q-plus" id="q-plus" aria-label="Eintragen"></button>
    <button class="q-text" id="q-text">Erzähl mir, was war …</button>
    <button class="q-mic" id="q-mic" aria-label="Per Sprache eintragen"></button>
  </div>

  <nav class="nav" id="nav">
    <div class="nav-inner">
      <button class="nav-btn" data-tab="today"><span class="pill" data-ic="home"></span>Heute</button>
      <button class="nav-btn" data-tab="food"><span class="pill" data-ic="apple"></span>Essen</button>
      <button class="nav-btn" data-tab="coach"><span class="pill" data-ic="spark"></span>Coach</button>
      <button class="nav-btn" data-tab="sport"><span class="pill" data-ic="dumbbell"></span>Sport</button>
      <button class="nav-btn" data-tab="progress"><span class="pill" data-ic="chart"></span>Fortschritt</button>
    </div>
  </nav>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
